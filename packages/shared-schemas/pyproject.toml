[project]
name = "inversa-schemas"
version = "0.1.0"
description = "Generated protobuf contracts for inversa.v1"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=7.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inversa"]
