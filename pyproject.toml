[tool.uv.workspace]
members = ["packages/shared-schemas", "services/ingestion"]

[project]
name = "inversa-home-challenge"
version = "0.1.0"

[dependency-groups]
dev = [
    "inversa-schemas",
    "inversa-ingestion",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-protobuf",
]

[tool.uv.sources]
inversa-schemas = { workspace = true }
inversa-ingestion = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["packages/shared-schemas/src/inversa"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "services/ingestion/src",
    "services/ingestion/tests",
    "packages/shared-schemas/src",
    "packages/shared-schemas/tests",
]
exclude = ["packages/shared-schemas/src/inversa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["packages/shared-schemas/tests", "services/ingestion/tests"]
