[tool.uv.workspace]
members = ["packages/shared-schemas", "services/ingestion", "services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["packages/shared-schemas/src/inversa_schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["packages/shared-schemas/src/inversa_schemas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/ingestion/tests", "services/api/tests"]
