[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inversa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inversa-schemas",
    "duckdb>=1.3",
    "fastmcp>=2.10",
    "fastapi>=0.116",
    "pydantic>=2.7",
    "pytz>=2024.1",
]

[tool.uv.sources]
inversa-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inversa"]
