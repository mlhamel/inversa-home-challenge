[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inversa-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inversa-schemas",
    "polars>=1.30",
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[tool.uv.sources]
inversa-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inversa"]
