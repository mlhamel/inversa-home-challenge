name: opencode-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(format(' {0} ', github.event.comment.body), ' /oc ') || contains(format(' {0} ', github.event.comment.body), ' /opencode ')) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_PATH: ${{ github.event.comment.path }}
      COMMENT_LINE: ${{ github.event.comment.line }}
      COMMENT_DIFF_HUNK: ${{ github.event.comment.diff_hunk }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-5-5' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: react to comment
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request_review_comment" ]; then
            gh api "repos/{owner}/{repo}/pulls/comments/${COMMENT_ID}/reactions" -f content=eyes
          else
            gh api "repos/{owner}/{repo}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes
          fi

      - name: guard open same-repo PR
        id: guard
        run: |
          PR_JSON="$(gh pr view "$PR_NUMBER" --json isCrossRepository,state)"
          if [ "$(jq -r .isCrossRepository <<<"$PR_JSON")" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body "🤖 OpenCode review automation only supports same-repository branches (GITHUB_TOKEN cannot push to forks)."
            exit 1
          fi
          if [ "$(jq -r .state <<<"$PR_JSON")" != "OPEN" ]; then
            gh pr comment "$PR_NUMBER" --body "🤖 **OpenCode** review automation: the pull request is closed — nothing to do."
            exit 1
          fi

      - name: checkout PR head (review comment)
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: checkout default branch (PR comment)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: checkout via gh (PR comment)
        if: github.event_name == 'issue_comment'
        run: gh pr checkout "$PR_NUMBER"

      - name: install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: write headless config
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permissions": [
              { "action": "question", "resource": "*", "effect": "deny" },
              { "action": "subagent", "resource": "*", "effect": "deny" }
            ]
          }
          JSON

      - name: build prompt
        run: |
          {
            printf 'You are responding to a code-review comment on pull request #%s in this repository.\n\n' "$PR_NUMBER"
            if [ -n "$COMMENT_PATH" ]; then
              printf 'File: %s\n' "$COMMENT_PATH"
              if [ -n "$COMMENT_LINE" ]; then
                printf 'Line: %s\n' "$COMMENT_LINE"
              fi
            fi
            if [ -n "$COMMENT_DIFF_HUNK" ]; then
              printf '\nDiff hunk under discussion:\n\n%s\n' "$COMMENT_DIFF_HUNK"
            fi
            printf '\nReviewer comment:\n\n%s\n\n' "$COMMENT_BODY"
            printf 'Instructions:\n'
            printf -- '- Read the relevant code, then implement exactly what the reviewer asked; if no change is appropriate, explain why in your final message.\n'
            printf -- '- Keep the change minimal and follow AGENTS.md conventions.\n'
            printf -- '- Do NOT run git commit or git push: the runner commits and pushes your file changes automatically.\n'
            printf -- '- Do not reply to GitHub (comments, statuses, checks): the runner communicates for you.\n'
          } > "$RUNNER_TEMP/prompt.txt"

      - name: run opencode
        run: |
          set -o pipefail
          opencode run \
            --standalone \
            --auto \
            --archived \
            --model "$OPENCODE_MODEL" \
            --title "pr-review: #$PR_NUMBER comment $COMMENT_ID" \
            "$(cat "$RUNNER_TEMP/prompt.txt")" 2>&1 | tee "$RUNNER_TEMP/opencode.log"

      - name: commit and push changes
        id: commit
        run: |
          rm -f opencode.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"
          git add -A
          echo "files<<GITHUB_FILES_EOF" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only >> "$GITHUB_OUTPUT"
          echo "GITHUB_FILES_EOF" >> "$GITHUB_OUTPUT"
          git commit -m "chore(repo): apply review feedback via opencode"
          git push origin HEAD
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: reply (changes pushed)
        if: steps.commit.outputs.pushed == 'true'
        env:
          FILES: ${{ steps.commit.outputs.files }}
        run: |
          {
            printf '🤖 **OpenCode** addressed the review comment and pushed %s file(s):\n' "$(printf '%s\n' "$FILES" | grep -c .)"
            printf '\n```text\n%s\n```\n' "$FILES"
            printf '\n<details><summary>OpenCode output (tail)</summary>\n\n```text\n%s\n```\n</details>\n' "$(tail -c 2000 "$RUNNER_TEMP/opencode.log")"
          } > "$RUNNER_TEMP/reply.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/reply.md"

      - name: reply (no changes)
        if: steps.commit.outputs.pushed == 'false'
        run: |
          {
            printf '🤖 **OpenCode** reviewed the comment and made no file changes.\n\n'
            printf '<details><summary>OpenCode output (tail)</summary>\n\n```text\n%s\n```\n</details>\n' "$(tail -c 2000 "$RUNNER_TEMP/opencode.log")"
          } > "$RUNNER_TEMP/reply-nochanges.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/reply-nochanges.md"

      - name: reply (failure)
        if: failure() && !cancelled() && steps.guard.outcome == 'success'
        run: gh pr comment "$PR_NUMBER" --body "🤖 **OpenCode** review automation failed — [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
