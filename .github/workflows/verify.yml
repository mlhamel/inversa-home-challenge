name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: bufbuild/buf-setup-action@v1
      - uses: yoheimuta/action-setup-protolint@v4
      - name: make verify
        run: make verify
      - name: conventional commit subjects
        run: scripts/check_conventional_commits.sh --range "origin/${{ github.base_ref }}..HEAD"
      - name: conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check_conventional_commits.sh --subject "$PR_TITLE"
