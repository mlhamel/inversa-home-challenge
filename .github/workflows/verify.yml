name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: bufbuild/buf-setup-action@v1
      - name: install protolint
        run: |
          cd /tmp
          curl -sSLo pl.tgz https://github.com/yoheimuta/protolint/releases/download/v0.58.0/protolint_0.58.0_linux_amd64.tar.gz
          curl -sSLo pl.sums https://github.com/yoheimuta/protolint/releases/download/v0.58.0/checksums.txt
          grep 'protolint_0.58.0_linux_amd64.tar.gz' pl.sums | sha256sum --check --strict
          tar -xzf pl.tgz
          install -m 0755 protolint "$HOME/.local/bin/protolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install prek
        run: uv tool install prek
      - name: make verify
        run: make verify
      - name: conventional commit subjects
        run: scripts/check_conventional_commits.sh --range "origin/${{ github.base_ref }}..HEAD"
      - name: conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check_conventional_commits.sh --subject "$PR_TITLE"
